name: windows-x64

# Builds the Windows x64 ggml / whisper.cpp / cudart archives that SkyrimNet pins in its
# external_versions.json, on GitHub-hosted runners.
#
# Versions and archive names are not written here. They come from the repo:
#   VERSION                      release version (a release tag must be v<VERSION>)
#   vcpkg-ports/*/vcpkg.json     ggml and whisper.cpp versions
#   ci/build-matrix.json         CUDA toolkits, whisper source variant, Vulkan SDK
#   CMakeLists.txt               dist folder (= archive) names
#
# pull_request / push to main / workflow_dispatch: build, verify and upload artifacts.
# Push of a v* tag: the same, then publish a GitHub release with the archives and SHA256SUMS.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Read versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      release_version: ${{ steps.versions.outputs.release_version }}
      vulkan_sdk: ${{ steps.versions.outputs.vulkan_sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read versions and build matrix
        id: versions
        # On a tag push this also fails fast when the tag is not v<VERSION>.
        run: python3 -I ci/release_assets.py matrix --tag "${GITHUB_REF}"

  build:
    name: Build (CUDA ${{ matrix.cuda }})
    needs: setup
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set paths and show disk space
        run: |
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-archives" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}

      - name: Install CUDA ${{ matrix.cuda }}
        run: ./ci/Install-CudaRedist.ps1 -Version '${{ matrix.cuda }}'

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4 # v1.2 + 1.4.x SDK support
        with:
          version: ${{ needs.setup.outputs.vulkan_sdk }}
          cache: true

      - name: Set up vcpkg at the registry baseline
        run: |
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          New-Item -ItemType Directory -Force -Path $env:VCPKG_ROOT, $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git -C $env:VCPKG_ROOT init -q
          git -C $env:VCPKG_ROOT fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $env:VCPKG_ROOT checkout -q FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      # vcpkg's ABI hash ignores the CUDA toolkit, so each toolkit gets its own cache line
      # (BuildRelease.ps1 also stamps the toolkit into the ggml portfile for the same reason).
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-windows-cuda${{ matrix.cuda }}-vk${{ needs.setup.outputs.vulkan_sdk }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'cmake/triplets/**') }}
          restore-keys: |
            vcpkg-bin-windows-cuda${{ matrix.cuda }}-vk${{ needs.setup.outputs.vulkan_sdk }}-

      - name: Generate build config
        run: |
          # BuildRelease.ps1 dot-sources Build_Config_Template.ps1 (local paths) and then
          # Build_Config_Local.ps1, so this file points it at the runner's toolchains.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsDevShell = Join-Path $vsPath "Common7\Tools\Launch-VsDevShell.ps1"
          if (-not (Test-Path $vsDevShell)) { throw "Launch-VsDevShell.ps1 not found under '$vsPath'" }
          if (-not (Test-Path (Join-Path $env:CUDA_PATH "bin\nvcc.exe"))) { throw "nvcc.exe not found under CUDA_PATH '$env:CUDA_PATH'" }
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) { throw "Vulkan SDK not found (VULKAN_SDK='$env:VULKAN_SDK')" }
          @(
            "# Generated by the windows-x64 workflow."
            "`$vsDevShellPath = '$vsDevShell'"
            "`$localDefaultThreads = $env:NUMBER_OF_PROCESSORS"
            "`$env:CUDA_PATH = '$env:CUDA_PATH'"
            "`$env:VULKAN_SDK = '$env:VULKAN_SDK'"
          ) | Set-Content -Path Build_Config_Local.ps1 -Encoding utf8
          Get-Content Build_Config_Local.ps1

      - name: Build
        run: |
          ./BuildRelease.ps1 -preset release
          if ($LASTEXITCODE -ne 0) { throw "BuildRelease.ps1 failed with exit code $LASTEXITCODE" }

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-logs-cuda${{ matrix.cuda_short }}
          path: |
            build/vcpkg_installed/vcpkg/blds/**/*.log
            build/release/vcpkg-manifest-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prune unused vcpkg binary packages
        if: success()
        run: |
          # Keep only the packages this build installed, so the cache does not grow with
          # every port change.
          $abis = @(Select-String -Path build/vcpkg_installed/vcpkg/status -Pattern '^Abi: (\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          $removed = 0
          Get-ChildItem $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File -Filter *.zip | ForEach-Object {
            if ($abis -notcontains $_.BaseName) { Remove-Item $_.FullName; $removed++ }
          }
          Write-Host "Installed ABIs: $($abis.Count); removed $removed stale archive(s)"
          Get-ChildItem $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File | Measure-Object Length -Sum |
            ForEach-Object { Write-Host ("Binary cache: {0} files, {1:N0} MB" -f $_.Count, ($_.Sum / 1MB)) }

      - name: Save vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # A failed build still keeps what it finished (e.g. shaderc, glslang) for the next run.
      - name: Save partial vcpkg binary cache
        if: failure() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive dist folders
        run: |
          $out = New-Item -ItemType Directory -Force -Path dist-zips
          $folders = @(Get-ChildItem -Path build/dist -Directory)
          if ($folders.Count -eq 0) { throw "No dist folders under build/dist" }
          foreach ($dir in $folders) {
            $zip = Join-Path $out "$($dir.Name).zip"
            7z a -tzip -bso0 -bsp0 $zip $dir.FullName
            if ($LASTEXITCODE -ne 0) { throw "7z failed to create $zip" }
          }
          New-Item -ItemType Directory -Force -Path dist-zips/whisper | Out-Null
          Move-Item dist-zips/whisper-windows-x64-*.zip dist-zips/whisper/
          Get-ChildItem dist-zips -Recurse -File | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload ggml and cudart archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-cuda${{ matrix.cuda_short }}
          path: dist-zips/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # whisper.dll / parakeet.dll only import ggml.dll and ggml-base.dll, so one variant's
      # build (ci/build-matrix.json: whisper_from_cuda) is published.
      - name: Upload whisper archive
        if: matrix.whisper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-whisper
          path: dist-zips/whisper/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Verify archives
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify layout and write SHA256SUMS
        run: |
          python3 -I ci/release_assets.py verify dist
          {
            echo '### Archives'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [setup, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      VT_API_KEY: ${{ secrets.VTOTAL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify, checksum and write notes
        run: |
          python3 -I ci/release_assets.py verify dist
          python3 -I ci/release_assets.py notes dist "$TAG" notes.md

      - name: Create or update release
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*.zip dist/SHA256SUMS
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file notes.md dist/*.zip dist/SHA256SUMS
          fi

      - name: Look up release id
        id: release
        if: env.VT_API_KEY != ''
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q .id)" >> "$GITHUB_OUTPUT"

      # Optional: runs only when the VTOTAL secret is set.
      - name: Scan with VirusTotal
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: cssnr/virustotal-action@5edfa4c982eb0caec6d568ea27cf715269f5c23b # v2.0.0
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          file_globs: |
            dist/ggml-windows-x64-*.zip
            dist/whisper-windows-x64-*.zip
            dist/cudart-windows-x64-*.zip
          update_release: true
          release_id: ${{ steps.release.outputs.id }}
