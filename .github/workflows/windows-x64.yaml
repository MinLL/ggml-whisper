name: windows-x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version information (e.g., 1.8.2)"
        required: true

permissions:
  contents: write

env:
  ARCHIVE_VERSION:
    |- # Enter release tag name or version name in workflow_dispatch
    ${{ github.event.release.tag_name || github.event.inputs.version || '1.0.3' }}

jobs:
  windows_x64:
    name: Build ggml / whisper.cpp libs for Windows x64 on ${{ matrix.os }} (CUDA ${{ matrix.cuda-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        cuda-version: ["13.4", "12.9"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Setup CUDA Toolkit
        uses: mjun0812/setup-cuda@v1
        with:
          version: '${{ matrix.cuda-version }}'
          method: 'local'

      - name: Install Vulkan SDK
        #uses: humbletim/install-vulkan-sdk@v1.2
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: 1.4.363.0
          cache: true

      - name: Restore vcpkg Binary Cache
        id: cache-vcpkg-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{matrix.cuda-version}}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{matrix.cuda-version}}-

      - name: Generate build config
        shell: pwsh
        run: |
          # BuildRelease.ps1 dot-sources Build_Config_Template.ps1, which hardcodes
          # local CUDA_PATH / VULKAN_SDK / VS dev shell paths that do not exist on
          # the runner. Build_Config_Local.ps1 is dot-sourced right after the
          # template, so writing it here points the build at the toolkits the
          # setup actions above installed.
          $cudaRoot = if ($env:CUDA_PATH) { $env:CUDA_PATH } else {
            Get-ChildItem "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA" -Directory |
              Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { $_.FullName }
          }
          if (-not (Test-Path (Join-Path $cudaRoot "bin\nvcc.exe"))) {
            throw "CUDA toolkit with nvcc.exe not found (looked at: $cudaRoot)"
          }
          $vulkanSdk = if ($env:VULKAN_SDK) { $env:VULKAN_SDK } else { "C:\VulkanSDK\1.4.363.0" }
          if (-not (Test-Path $vulkanSdk)) {
            throw "Vulkan SDK not found at: $vulkanSdk"
          }
          $vsDevShell = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1"
          if (-not (Test-Path $vsDevShell)) {
            throw "VS 2022 dev shell script not found at: $vsDevShell"
          }
          $config = @"
            # CI-generated by the windows-x64 workflow - do not edit by hand.
            `$vsDevShellPath = `"$vsDevShell`"
            `$localDefaultThreads = 4
            `$env:CUDA_PATH=`"$cudaRoot`"
            `$env:VULKAN_SDK=`"$vulkanSdk`"
          "@
          Set-Content -Path .\Build_Config_Local.ps1 -Value $config -Encoding UTF8
          Write-Host "Generated Build_Config_Local.ps1:"
          Get-Content .\Build_Config_Local.ps1

      - name: Build ggml / whisper.cpp for Windows x64 Release
        shell: pwsh
        run: |
          cmake --version
          .\BuildRelease.ps1 -preset release -threads 4
          if ($LASTEXITCODE -ne 0) {
            throw "BuildRelease.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Save vcpkg Binary Cache
        if: always() && steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/vcpkg
            build/vcpkg_installed
          key: ${{ steps.cache-vcpkg-restore.outputs.cache-primary-key }}


      - name: Debug folder list
        shell: pwsh
        run: |
          Write-Host "Listing contents: "
          Get-ChildItem "."


      - name: Archive each dist folder
        shell: pwsh
        run: |
          $distRoot = "build/dist"
          if (-not (Test-Path $distRoot)) { throw "Dist root not found: $distRoot" }
          $folders = Get-ChildItem -Path $distRoot -Directory
          if ($folders.Count -eq 0) { throw "No dist folders found under $distRoot" }
          foreach ($dir in $folders) {
            $zip = "$($dir.Name).zip"
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Write-Host "Archiving $($dir.Name) -> $zip"
            7z a -tzip $zip $dir.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed to create $zip" }
          }
          Write-Host "Created archives:"
          Get-ChildItem ./*.zip

      - name: Upload dist archives
        uses: actions/upload-artifact@v7
        with:
          name: ggml-whisper-dist-cuda-${{ matrix.cuda-version }}
          path: "./*.zip"
          retention-days: 1

  release:
    name: Upload
    runs-on: ubuntu-latest
    needs: [windows_x64]
    steps:
      - name: Download dist archives
        uses: actions/download-artifact@v8
        with:
          pattern: "ggml-whisper-dist-cuda-*"
          merge-multiple: true

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          file: "./*.zip"
          overwrite: true
          repo_name: ${{ github.repository }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.ARCHIVE_VERSION }}

      - name: Scan ggml with VirusTotal
        continue-on-error: true
        uses: cssnr/virustotal-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vt_api_key: ${{ secrets.VTOTAL }}
          file_globs: |
            ggml-windows-x64-*.zip
          update_release: true
          release_id: v${{ env.ARCHIVE_VERSION }}

      - name: Scan whisper with VirusTotal
        continue-on-error: true
        uses: cssnr/virustotal-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vt_api_key: ${{ secrets.VTOTAL }}
          file_globs: |
            whisper-windows-x64-*.zip
          update_release: true
          release_id: v${{ env.ARCHIVE_VERSION }}

      - name: Scan cudart with VirusTotal
        continue-on-error: true
        uses: cssnr/virustotal-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vt_api_key: ${{ secrets.VTOTAL }}
          file_globs: |
            cudart-windows-x64-*.zip
          update_release: true
          release_id: v${{ env.ARCHIVE_VERSION }}
